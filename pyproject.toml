[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "pixeldebug"
version = "0.1.0"
description = "Evidence-first visual regression diagnostics"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1", "python-multipart>=0.0.18", "pillow>=11,<13", "numpy>=2,<3", "opencv-python-headless>=4.10,<5", "scikit-image>=0.24,<1", "pydantic-settings>=2.6,<3"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "playwright>=1.49,<2"]
ml = ["torch>=2.6,<3", "transformers>=4.51,<5", "safetensors>=0.5", "sentencepiece>=0.2"]
[tool.setuptools.packages.find]
include = ["pixeldebug*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
