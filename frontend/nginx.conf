server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 17m;
    add_header X-Content-Type-Options nosniff;
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_read_timeout 120s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
